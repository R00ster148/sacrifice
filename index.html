<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sacrifice — a card game</title>
<style>
  :root{
    --wood:#160f08; --wood-light:#241809; --paper:#e0cda0; --blood:#6a1008; --blood-bright:#b8401a;
    --gold:#c89244; --ink:#0c0a08; --bone:#e3cf9e;
  }
  * { box-sizing: border-box; }
  html,body{ margin:0; min-height:100vh; background:#0a0502; }
  body{
    font-family: 'Courier New', monospace; color: var(--bone); overflow-x:hidden; position:relative;
    background:
      radial-gradient(ellipse 1000px 760px at 50% 10%, rgba(255,140,40,0.22) 0%, rgba(0,0,0,0) 62%),
      radial-gradient(ellipse at center, #1c0f06 0%, #060301 100%);
  }
  #warmth{
    position:fixed; inset:0; z-index:5; pointer-events:none; mix-blend-mode:overlay;
    background: radial-gradient(ellipse 70% 55% at 50% 30%, rgba(255,150,60,0.35), transparent 70%),
                radial-gradient(ellipse 90% 60% at 50% 100%, rgba(255,110,30,0.28), transparent 70%);
  }
  /* distant rafters / cabin silhouette */
  #scene{
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  #scene::before{
    content:''; position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.75) 100%),
      repeating-linear-gradient(100deg, rgba(0,0,0,0.35) 0px, rgba(0,0,0,0.35) 60px, transparent 60px, transparent 220px);
  }
  #scene .pillar{
    position:absolute; top:0; bottom:0; width:90px;
    background: linear-gradient(90deg, rgba(0,0,0,0.9), rgba(20,14,8,0.5) 40%, rgba(0,0,0,0.9));
    filter: blur(1px);
  }
  #scene .pillar.p1{ left:-2%; } #scene .pillar.p2{ right:-2%; }
  #scene .glow{
    position:absolute; top:-10%; left:50%; width:700px; height:700px; margin-left:-350px;
    background: radial-gradient(circle, rgba(255,150,50,0.10), transparent 70%);
  }
  #scene .fog{
    position:absolute; left:0; right:0; bottom:0; height:40%;
    background: linear-gradient(180deg, transparent, rgba(10,8,6,0.7));
  }
  #embers{ position:absolute; inset:0; overflow:hidden; }
  .ember{
    position:absolute; bottom:-10px; width:3px; height:3px; border-radius:50%;
    background: radial-gradient(circle, #ffc880, rgba(255,140,40,0) 70%);
    opacity:0; animation: emberFloat linear infinite;
  }
  @keyframes emberFloat{
    0%{ transform:translateY(0) translateX(0) scale(0.6); opacity:0; }
    8%{ opacity:0.85; }
    50%{ transform:translateY(-50vh) translateX(12px) scale(1); }
    85%{ opacity:0.4; }
    100%{ transform:translateY(-100vh) translateX(-8px) scale(0.3); opacity:0; }
  }
  /* film grain */
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:999; opacity:0.05; mix-blend-mode:overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    animation: grain 1s steps(2) infinite;
  }
  @keyframes grain{ 0%{ transform:translate(0,0);} 50%{ transform:translate(-2%,1%);} 100%{ transform:translate(1%,-2%);} }
  /* vignette */
  body::after{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:998;
    box-shadow: inset 0 0 220px 90px #000;
  }
  /* flicker overlay */
  #flicker{ position:fixed; inset:0; pointer-events:none; z-index:997; background:#000; opacity:0; }

  #game{ max-width:1150px; margin:0 auto; padding:18px; position:relative; z-index:1; }
  h1{
    text-align:center; letter-spacing:6px; color:var(--gold); font-size:30px; margin:8px 0 2px;
    text-shadow:0 0 18px rgba(140,20,20,0.55), 0 2px 0 #000; font-weight:normal;
  }
  #subtitle{ text-align:center; color:#5e4f36; font-size:11px; margin-bottom:16px; letter-spacing:3px; text-transform:uppercase;}

  #log{
    background:#000; border:1px solid #211609; height:56px; overflow-y:auto;
    font-size:12px; color:#8a7748; padding:7px 12px; margin-bottom:12px; border-radius:3px;
    box-shadow: inset 0 0 12px #000;
  }
  #log div{ margin-bottom:2px; opacity:0.9; }
  #log div.fresh{ color:var(--bone); }

  .board{
    perspective: 2000px; padding:10px 10px 60px;
  }
  .board-table{
    position:relative;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.26) 0px, rgba(0,0,0,0.26) 2px, transparent 2px, transparent 26px),
      repeating-linear-gradient(0deg, rgba(255,180,90,0.025) 0px, rgba(255,180,90,0.025) 1px, transparent 1px, transparent 5px),
      repeating-linear-gradient(91deg, rgba(255,160,70,0.05) 0px, transparent 3px, transparent 24px, rgba(0,0,0,0.18) 26px),
      radial-gradient(ellipse 60% 40% at 30% 20%, rgba(130,75,25,0.24), transparent 60%),
      radial-gradient(ellipse 50% 30% at 80% 70%, rgba(120,65,20,0.2), transparent 60%),
      linear-gradient(180deg, #2c2010 0%, #0e0805 100%);
    border:1px solid #34230f; border-radius:6px; padding:34px 24px 50px;
    box-shadow: inset 0 0 90px #000, inset 0 50px 100px -40px rgba(255,170,60,0.26), 0 50px 50px -15px rgba(0,0,0,0.9);
    transform: rotateX(24deg);
    transform-origin: center top;
  }
  .board-table::before{
    content:''; position:absolute; left:6%; right:6%; top:-36px; height:90px; pointer-events:none;
    background: radial-gradient(ellipse at center, rgba(255,170,80,0.42), transparent 75%);
    filter: blur(3px);
  }
  .board-table::after{
    content:''; position:absolute; inset:0; pointer-events:none; border-radius:6px;
    box-shadow: inset 0 0 0 1px rgba(200,150,60,0.18), inset 0 0 40px 10px rgba(0,0,0,0.5);
  }
  /* carved corner studs for extra table detail */
  .board-table .stud{
    position:absolute; width:10px; height:10px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #cf9a4e, #5a3a14 70%, #1a0f04);
    box-shadow: 0 1px 2px #000, inset 0 0 2px #000;
  }
  .board-table .stud.tl{ top:10px; left:10px; } .board-table .stud.tr{ top:10px; right:10px; }
  .board-table .stud.bl{ bottom:10px; left:10px; } .board-table .stud.br{ bottom:10px; right:10px; }

  .row{ display:grid; grid-template-columns: repeat(4, 114px); justify-content:center; gap:20px; padding:14px 0; min-height:150px; align-items:center; }
  .row.enemy{ margin-bottom:26px; }
  .row.enemy .slot{ transform: scale(0.86); filter: brightness(0.85); opacity:0.9; }
  #player-row .slot{ transform: scale(1.05); }

  .telegraph-row{ min-height:96px; padding:0; transform:scale(0.78); filter:brightness(0.82); margin-bottom:-34px; }
  .telegraph-cell{
    width:114px; height:96px; display:flex; align-items:center; justify-content:center; position:relative;
    border:1px solid rgba(120,80,30,0.22); border-radius:6px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.3), rgba(0,0,0,0.55));
    box-shadow: inset 0 0 16px #000;
  }
  .telegraph-cell::before{
    content:''; position:absolute; width:72%; height:60%; border:1px dashed rgba(200,150,60,0.18); border-radius:8px; pointer-events:none;
  }
  .telegraph-cell.active{ border-color:rgba(255,130,40,0.45); box-shadow: inset 0 0 18px #000, 0 0 18px rgba(255,90,20,0.3); }
  .telegraph-cell .arrow-icon{ width:50px; height:50px; opacity:0.25; transition: opacity .2s ease; position:relative; z-index:2; }
  .telegraph-cell.active .arrow-icon{ opacity:1; }
  .telegraph-cell .arrow-icon svg{ width:100%; height:100%; filter: drop-shadow(0 2px 2px #000); }
  .telegraph-cell .arrow-icon svg .shaft{ fill:#5a4326; stroke:#1c1206; stroke-width:2; stroke-linejoin:round; }
  .telegraph-cell .arrow-icon svg .shine{ stroke:#7a6038; stroke-width:1.6; opacity:0.7; fill:none; }
  .telegraph-cell.active .arrow-icon svg{ filter: drop-shadow(0 0 12px #ff5a14) drop-shadow(0 2px 2px #000); }
  .telegraph-cell.active .arrow-icon svg .shaft{ fill:#ffaa50; stroke:#5a2a0a; }
  .telegraph-cell.active .arrow-icon svg .shine{ stroke:#ffe0a8; }
  .slot{
    width:114px; height:160px; border:1px solid #241a0e; border-radius:6px;
    display:flex; align-items:center; justify-content:center; position:relative;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0.35), rgba(0,0,0,0.6));
    box-shadow: inset 0 0 14px #000, 0 16px 20px -10px rgba(0,0,0,0.85);
  }
  .slot::before{
    content:''; position:absolute; width:74%; height:74%; border:1px dashed rgba(156,122,46,0.16); border-radius:50%; pointer-events:none;
  }
  .slot::after{ display:none; }
  .slot.targetable{ border-color:var(--blood-bright); box-shadow:0 0 16px rgba(138,20,20,0.6), inset 0 0 14px #000; cursor:crosshair; }
  .slot.targetable.drag-hover{ box-shadow:0 0 28px rgba(138,20,20,0.9), inset 0 0 14px #000; border-color:#c83a3a; }
  #drag-ghost{ position:fixed; z-index:999; pointer-events:none; transform:translate(-50%,-50%) scale(1.12) rotate(-4deg); }

  .card{
    width:108px; height:152px; border-radius:6px; position:relative; cursor:pointer;
    user-select:none; transform-style: preserve-3d; will-change: transform;
    transition: box-shadow .15s ease;
  }
  .card .face{
    position:absolute; inset:0; border-radius:6px; padding:8px;
    background:
      radial-gradient(ellipse 140% 90% at 50% -10%, rgba(255,255,255,0.05), transparent 60%),
      linear-gradient(160deg, rgba(255,255,255,0.04), rgba(0,0,0,0.3)),
      linear-gradient(180deg, #2c2218 0%, #120e09 100%);
    border:1px solid #4a3a22; color: var(--paper);
    display:flex; flex-direction:column; justify-content:space-between;
    box-shadow: 0 8px 18px rgba(0,0,0,0.75), inset 0 0 18px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.04);
    overflow:hidden;
  }
  .card .face::before{
    content:''; position:absolute; inset:0; pointer-events:none; opacity:0.55;
    background: radial-gradient(circle at var(--gx,50%) var(--gy,30%), rgba(255,255,255,0.12), transparent 55%);
  }
  .card .frame{
    position:absolute; inset:3px; border:1px solid rgba(156,122,46,0.35); border-radius:4px; pointer-events:none; z-index:2;
  }
  .card .frame::before, .card .frame::after,
  .card .frame .c2::before, .card .frame .c2::after{
    content:''; position:absolute; width:8px; height:8px; border:1px solid rgba(201,162,46,0.7);
  }
  .card .frame::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .card .frame::after{ top:-1px; right:-1px; border-left:none; border-bottom:none; }
  .card .frame .c2::before{ bottom:-1px; left:-1px; border-right:none; border-top:none; }
  .card .frame .c2::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
  .card.enemy-card .face{
    background:
      radial-gradient(ellipse 140% 90% at 50% -10%, rgba(255,255,255,0.04), transparent 60%),
      linear-gradient(160deg, rgba(255,255,255,0.03), rgba(0,0,0,0.35)),
      linear-gradient(180deg, #271515 0%, #100a0a 100%);
    border-color:#5a2222;
  }
  .card.enemy-card .frame{ border-color:rgba(196,90,90,0.3); }
  .card.enemy-card .frame::before, .card.enemy-card .frame::after,
  .card.enemy-card .frame .c2::before, .card.enemy-card .frame .c2::after{ border-color:rgba(196,90,90,0.6); }
  .card.selected .face{ outline:2px solid var(--gold); box-shadow:0 0 18px rgba(156,122,46,0.5), 0 8px 18px rgba(0,0,0,0.75); }
  .card .name{ font-size:10px; font-weight:bold; text-align:center; line-height:1.15; letter-spacing:0.5px; color:#bfae84; text-transform:uppercase; z-index:2; text-shadow:0 1px 0 #000; }
  .card .sigil-wrap{ flex:1; display:flex; align-items:center; justify-content:center; z-index:2; position:relative; }
  .card .sigil-wrap::before{
    content:''; position:absolute; width:54px; height:54px; border:1px solid rgba(156,122,46,0.18); border-radius:50%;
  }
  .card .sigil-wrap svg{
    width:58px; height:58px; overflow:visible;
    filter: drop-shadow(0 2px 1px rgba(0,0,0,0.9)) drop-shadow(0 0 7px rgba(0,0,0,0.6));
  }
  .card .sigil-wrap svg path, .card .sigil-wrap svg circle, .card .sigil-wrap svg ellipse{
    fill:url(#inkBone); stroke:#241a0e; stroke-width:1; stroke-linejoin:round; stroke-linecap:round;
  }
  .card .sigil-wrap svg .eye{ fill:#15100a; stroke:none; }
  .card .sigil-wrap svg .pupil{ fill:#070504; stroke:none; }
  .card .sigil-wrap svg .hatch, .card .sigil-wrap svg .wisp, .card .sigil-wrap svg .scar,
  .card .sigil-wrap svg .leg, .card .sigil-wrap svg .claw, .card .sigil-wrap svg .antler,
  .card .sigil-wrap svg .brow{
    fill:none; stroke:#f0e2bc; stroke-width:2.2; opacity:0.9;
  }
  .card .sigil-wrap svg .ear, .card .sigil-wrap svg .tail, .card .sigil-wrap svg .wing,
  .card .sigil-wrap svg .beak, .card .sigil-wrap svg .tusk, .card .sigil-wrap svg .fang,
  .card .sigil-wrap svg .tuft, .card .sigil-wrap svg .ridge, .card .sigil-wrap svg .hollow,
  .card .sigil-wrap svg .snout, .card .sigil-wrap svg .head{
    stroke:#f0e2bc; stroke-width:1.3; stroke-opacity:0.7;
  }
  .card.enemy-card .sigil-wrap svg path, .card.enemy-card .sigil-wrap svg circle, .card.enemy-card .sigil-wrap svg ellipse{
    fill:url(#inkBlood); stroke:#3a1414;
  }
  .card.enemy-card .sigil-wrap svg .eye{ fill:#1a0a0a; stroke:none; }
  .card.enemy-card .sigil-wrap svg .hatch, .card.enemy-card .sigil-wrap svg .wisp, .card.enemy-card .sigil-wrap svg .scar,
  .card.enemy-card .sigil-wrap svg .leg, .card.enemy-card .sigil-wrap svg .claw, .card.enemy-card .sigil-wrap svg .antler,
  .card.enemy-card .sigil-wrap svg .brow{
    stroke:#f0c0c0;
  }
  .card.enemy-card .sigil-wrap svg .ear, .card.enemy-card .sigil-wrap svg .tail, .card.enemy-card .sigil-wrap svg .wing,
  .card.enemy-card .sigil-wrap svg .beak, .card.enemy-card .sigil-wrap svg .tusk, .card.enemy-card .sigil-wrap svg .fang,
  .card.enemy-card .sigil-wrap svg .tuft, .card.enemy-card .sigil-wrap svg .ridge, .card.enemy-card .sigil-wrap svg .hollow,
  .card.enemy-card .sigil-wrap svg .snout, .card.enemy-card .sigil-wrap svg .head{
    stroke:#f0c0c0;
  }
  .card.enemy-card .sigil-wrap::before{ border-color:rgba(196,90,90,0.18); }
  .card .cost{ position:absolute; top:4px; left:4px; display:flex; gap:1px; z-index:3; }
  .card .cost svg{ width:9px; height:11px; }
  .card .stats{ display:flex; justify-content:space-between; align-items:center; padding:0 2px; z-index:2; }
  .stat{ display:flex; align-items:center; gap:3px; font-size:12px; font-weight:bold; }
  .stat svg{ width:13px; height:13px; }
  .stat.atk{ color:#c45a5a; } .stat.atk svg{ stroke:#c45a5a; }
  .stat.hp{ color:#9fae8a; } .stat.hp svg{ stroke:#9fae8a; fill:none; }

  .card.dying{ animation: dying .5s forwards; }
  @keyframes dying{
    0%{ filter:none; }
    40%{ filter: drop-shadow(0 0 10px rgba(138,20,20,0.9)); }
    100%{ opacity:0; transform: scale(0.4) rotateZ(35deg) translateY(20px); filter: drop-shadow(0 0 0 rgba(0,0,0,0)); }
  }
  .card.attacking{ animation: attackBump .32s; }
  @keyframes attackBump{ 50%{ transform: translateY(-28px) scale(1.06) rotateZ(-3deg); } }
  .card.hit{ animation: hitShake .3s; }
  @keyframes hitShake{ 20%{transform:translateX(-7px) rotateZ(-2deg);} 60%{transform:translateX(6px) rotateZ(2deg);} }
  .card.hit .face::after{
    content:''; position:absolute; inset:0; background:radial-gradient(circle at 50% 50%, rgba(120,10,10,0.55), transparent 70%);
    animation: bloodFlash .35s ease-out;
  }
  @keyframes bloodFlash{ from{opacity:1;} to{opacity:0;} }

  .empty-slot-icon{ width:62px; height:62px; opacity:0.38; transition: opacity .2s ease, filter .2s ease; }
  .empty-slot-icon svg .pad{ fill:#caa45a; }
  .empty-slot-icon svg .pad-line{ fill:#5c4420; opacity:0.6; }
  .empty-slot-icon svg{ width:100%; height:100%; stroke:none; filter: drop-shadow(0 0 4px rgba(0,0,0,0.85)); }
  .slot.targetable .empty-slot-icon{ opacity:0.9; filter: drop-shadow(0 0 9px var(--blood-bright)); }
  .slot.targetable .empty-slot-icon svg .pad{ fill:var(--blood-bright); }
  .slot.targetable .empty-slot-icon svg .pad-line{ fill:#2a0606; }
  .slot.targetable.drag-hover .empty-slot-icon{ opacity:1; filter: drop-shadow(0 0 16px #ff4040); }


  #hand{ position:relative; height:300px; margin:6px 0 -54px; perspective:1400px; overflow:visible; z-index:30; }
  .hand-slot{
    position:absolute; left:50%; top:0; width:108px; height:152px; margin-left:-54px;
    transform-origin: 50% 640px; transition: transform .25s ease;
  }
  .hand-slot.raised{ z-index:200; }
  .hand-lift{ transition: transform .15s ease; transform-origin: 50% 100%; }
  .hand-slot.raised .hand-lift{ transform: translateY(-46px) scale(1.16); }

  #stats-row{ display:flex; justify-content:space-between; align-items:center; margin:12px 0; gap:18px; }
  .meter-block{ flex:1; }
  .meter-label{ font-size:11px; letter-spacing:2px; color:#6e5d3e; text-transform:uppercase; margin-bottom:4px; display:flex; justify-content:space-between; }
  .meter-label .bones-count{ color:var(--gold); }
  .meter{
    height:14px; border:1px solid #2a1d10; border-radius:3px; background:#0a0705; overflow:hidden;
    box-shadow: inset 0 0 8px #000;
  }
  .meter-fill{ height:100%; background:linear-gradient(90deg, #4a0a0a, #8a1414); transition: width .4s ease; box-shadow:0 0 10px rgba(138,20,20,0.6); }
  .meter-fill.enemy-fill{ background:linear-gradient(90deg, #5a0a0a, #9c1c1c); }

  #controls{ text-align:center; margin-top:16px; }
  button{
    background: linear-gradient(180deg, #221a10, #14100a); color: var(--gold); border:1px solid #4a3a22;
    padding:9px 20px; font-family:inherit; font-size:12px; letter-spacing:2px; cursor:pointer;
    border-radius:4px; margin:0 5px; text-transform:uppercase;
    box-shadow:0 3px 8px rgba(0,0,0,0.6);
  }
  button:disabled{ opacity:0.3; cursor:not-allowed; }
  button:hover:not(:disabled){ background:linear-gradient(180deg,#3a2a12,#1c140a); color:#e0c068; box-shadow:0 0 14px rgba(156,122,46,0.35); }

  #overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.92); display:flex; align-items:center; justify-content:center;
    flex-direction:column; z-index:50;
  }
  #overlay h2{ color:#8a1414; font-size:40px; letter-spacing:6px; text-shadow:0 0 30px rgba(138,20,20,0.8); font-weight:normal; }
  #overlay p{ color:#7a6948; max-width:480px; text-align:center; line-height:1.7; font-size:13px; }
  .hidden{ display:none !important; }

  .hint{ text-align:center; font-size:11px; color:#534228; margin-top:8px; min-height:14px; letter-spacing:1px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="inkBone" cx="40%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e9dcb8"/>
      <stop offset="55%" stop-color="#a8946a"/>
      <stop offset="100%" stop-color="#372a18"/>
    </radialGradient>
    <radialGradient id="inkBlood" cx="40%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e8b8b8"/>
      <stop offset="55%" stop-color="#a85a5a"/>
      <stop offset="100%" stop-color="#2a1010"/>
    </radialGradient>
  </defs>
</svg>
<div id="scene"><div class="glow"></div><div class="pillar p1"></div><div class="pillar p2"></div><div class="fog"></div><div class="embers" id="embers"></div></div>
<div id="warmth"></div>
<div id="flicker"></div>
<div id="game">
  <h1>SACRIFICE</h1>
  <div id="subtitle">a game of blood and bargains</div>
  <div id="log"></div>

  <div id="stats-row">
    <div class="meter-block">
      <div class="meter-label"><span>You — bones: <span class="bones-count" id="player-bones">0</span></span><span id="player-hp-text"></span></div>
      <div class="meter"><div class="meter-fill" id="player-meter"></div></div>
    </div>
    <div class="meter-block">
      <div class="meter-label"><span>Opponent</span><span id="enemy-hp-text"></span></div>
      <div class="meter"><div class="meter-fill enemy-fill" id="enemy-meter"></div></div>
    </div>
  </div>

  <div class="board">
    <div class="board-table">
      <span class="stud tl"></span><span class="stud tr"></span><span class="stud bl"></span><span class="stud br"></span>
      <div class="row telegraph-row" id="telegraph-row"></div>
      <div class="row enemy" id="enemy-row"></div>
      <div class="row" id="player-row"></div>
    </div>
  </div>

const DROP_SVG = '<svg viewBox="0 0 12 16"><path d="M6 1 C6 1 1 9 1 12 C1 14.2 3.2 16 6 16 C8.8 16 11 14.2 11 12 C11 9 6 1 6 1 Z" fill="#7a1414" stroke="#3a0a0a" stroke-width="0.6"/></svg>';

const RIB_SVG = '<svg viewBox="0 0 24 24"><path d="M12 2 V22 M12 6 Q6 7 5 11 M12 6 Q18 7 19 11 M12 11 Q6 12 5 16 M12 11 Q18 12 19 16"/></svg>';

/* ---------- Card definitions ---------- */
// cost = number of creatures that must be sacrificed to play it (blood cost). 0 = free.
const CARD_POOL = [
  { id:'mouse', name:'Squirrel', atk:0, hp:1, cost:0 },
  { id:'mole', name:'Mole', atk:1, hp:1, cost:0 },
  { id:'wolf', name:'Wolf Pup', atk:2, hp:2, cost:1 },
  { id:'bird', name:'Crow', atk:2, hp:1, cost:1 },
  { id:'boar', name:'Boar', atk:3, hp:3, cost:1 },
  { id:'bear', name:'Bear', atk:4, hp:5, cost:2 },
  { id:'stag', name:'Elder Stag', atk:5, hp:4, cost:2 },
  { id:'wolverine', name:'Wolverine', atk:3, hp:2, cost:1 },
  { id:'spider', name:'Cave Spider', atk:1, hp:1, cost:0 },
  { id:'owl', name:'Night Owl', atk:2, hp:2, cost:1 },
  { id:'wyrm', name:'Bone Wyrm', atk:6, hp:6, cost:3 },
  { id:'raven', name:'Omen Raven', atk:1, hp:3, cost:0 },
];

const ENEMY_POOL = [
  { id:'rat', name:'Sewer Rat', atk:1, hp:1, cost:0 },
  { id:'hound', name:'Hound', atk:2, hp:2, cost:1 },
  { id:'crow2', name:'Carrion Crow', atk:2, hp:1, cost:0 },
  { id:'ogre', name:'Ogre', atk:4, hp:4, cost:1 },
  { id:'wraith', name:'Wraith', atk:3, hp:3, cost:1 },
  { id:'troll', name:'Troll', atk:5, hp:6, cost:2 },
  { id:'wyvern', name:'Wyvern', atk:6, hp:5, cost:2 },
];

const LANES = 4;
let state = null;

function freshCard(def){
  return { ...def, uid: Math.random().toString(36).slice(2), curHp: def.hp };
}

function newGame(){
  state = {
    playerHP: 20,
    enemyHP: 20,
    playerBones: 0,
    playerBoard: Array(LANES).fill(null),
    enemyBoard: Array(LANES).fill(null),
    hand: [],
    selectedHandIdx: null,
    sacrificeMode: false,
    turn: 'player',
    over: false,
    enemyTelegraph: [],
  };
  drawHand(5);
  planEnemyTelegraph();
  log('A new game begins. The board awaits.');
  render();
}

function drawCard(){
  const def = CARD_POOL[Math.floor(Math.random()*CARD_POOL.length)];
  return freshCard(def);
}
function drawEnemyCard(){
  const def = ENEMY_POOL[Math.floor(Math.random()*ENEMY_POOL.length)];
  return freshCard(def);
}
function drawHand(n){
  for(let i=0;i<n;i++){
    if(state.hand.length < 6) state.hand.push(drawCard());
  }
}

function log(msg){
  const el = document.getElementById('log');
  Array.from(el.children).forEach(c => c.classList.remove('fresh'));
  const div = document.createElement('div');
  div.className = 'fresh';
  div.textContent = msg;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
  flicker();
}

function flicker(){
  const f = document.getElementById('flicker');
  f.style.transition = 'none';
  f.style.opacity = (0.04 + Math.random()*0.05).toString();
  requestAnimationFrame(() => {
    f.style.transition = 'opacity .25s ease';
    f.style.opacity = '0';
  });
}

/* ---------- 3D tilt ---------- */
function attachTilt(el){
  el.addEventListener('mousemove', e => {
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width;
    const py = (e.clientY - r.top) / r.height;
    const rx = (py - 0.5) * -18;
    const ry = (px - 0.5) * 18;
    el.style.transform = `translateY(-6px) perspective(700px) rotateX(${rx}deg) rotateY(${ry}deg) scale(1.05)`;
    const face = el.querySelector('.face');
    if(face){ face.style.setProperty('--gx', (px*100)+'%'); face.style.setProperty('--gy', (py*100)+'%'); }
  });
  el.addEventListener('mouseleave', () => {
    el.style.transform = '';
  });
}

/* ---------- Rendering ---------- */
function render(){
  renderHealth();
  renderBoard();
  renderHand();
  document.getElementById('player-bones').textContent = state.playerBones;
  const hint = document.getElementById('hint');
  if(state.sacrificeMode){
    hint.textContent = 'Click creatures on your side to sacrifice them as payment. Esc to cancel.';
  } else {
    hint.textContent = state.turn === 'player' ? 'Drag a card onto a paw-marked lane to play it. Glowing orange paws show where the opponent will strike next.' : "Opponent's turn...";
  }
  document.getElementById('end-turn-btn').disabled = state.turn !== 'player' || state.over;
}

function renderHealth(){
  const pPct = Math.max(0, state.playerHP) / 20 * 100;
  const ePct = Math.max(0, state.enemyHP) / 20 * 100;
  document.getElementById('player-meter').style.width = pPct + '%';
  document.getElementById('enemy-meter').style.width = ePct + '%';
  document.getElementById('player-hp-text').textContent = Math.max(0,state.playerHP) + ' / 20';
  document.getElementById('enemy-hp-text').textContent = Math.max(0,state.enemyHP) + ' / 20';
}

function cardHTML(card){
  let dots = '';
  for(let i=0;i<card.cost;i++) dots += DROP_SVG;
  return `
    <div class="face">
      <div class="frame"><span class="c2"></span></div>
      <div class="cost">${dots}</div>
      <div class="name">${card.name}</div>
      <div class="sigil-wrap">${sigilSVG(card.id)}</div>
      <div class="stats">
        <span class="stat atk">${DAGGER_SVG}${card.atk}</span>
        <span class="stat hp">${RIB_SVG}${card.curHp}</span>
      </div>
    </div>
  `;
}

const EMPTY_SLOT_SVG = `<svg viewBox="0 0 48 48">
  <ellipse class="pad" cx="24" cy="33" rx="13" ry="10.5"/>
  <path class="pad-line" d="M14 30 Q24 37 34 30 Q24 41 14 30 Z"/>
  <path class="pad-line" d="M18 25 Q24 30 30 25 Q24 32 18 25 Z" opacity="0.5"/>
  <ellipse class="pad" cx="8" cy="16" rx="5.4" ry="7" transform="rotate(-22 8 16)"/>
  <ellipse class="pad" cx="18.5" cy="9" rx="5.2" ry="7.2" transform="rotate(-8 18.5 9)"/>
  <ellipse class="pad" cx="29.5" cy="9" rx="5.2" ry="7.2" transform="rotate(8 29.5 9)"/>
  <ellipse class="pad" cx="40" cy="16" rx="5.4" ry="7" transform="rotate(22 40 16)"/>
  <path class="pad-line" d="M5 13 L4 9 M19 6 L18.5 1.5 M29.5 6 L30 1.5 M43 13 L44 9" stroke="#3a2a12" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.8"/>
</svg>`;
const ARROW_DOWN_SVG = '<svg viewBox="0 0 40 56"><path class="shaft" d="M14 2 H26 V26 H36 L20 50 L4 26 H14 Z"/><path class="shine" d="M17 6 V24"/></svg>';

function renderBoard(){
  const telegraphRow = document.getElementById('telegraph-row');
  const enemyRow = document.getElementById('enemy-row');
  const playerRow = document.getElementById('player-row');
  telegraphRow.innerHTML = '';
  enemyRow.innerHTML = '';
  playerRow.innerHTML = '';

  for(let i=0;i<LANES;i++){
    const cell = document.createElement('div');
    cell.className = 'telegraph-cell';
    if(state.enemyTelegraph && state.enemyTelegraph.includes(i)) cell.classList.add('active');
    cell.innerHTML = `<span class="arrow-icon">${ARROW_DOWN_SVG}</span>`;
    telegraphRow.appendChild(cell);
  }

  for(let i=0;i<LANES;i++){
    const slot = document.createElement('div');
    slot.className = 'slot';
    const card = state.enemyBoard[i];
    if(card){
      const c = document.createElement('div');
      c.className = 'card enemy-card';
      c.dataset.uid = card.uid;
      c.innerHTML = cardHTML(card);
      attachTilt(c);
      slot.appendChild(c);
    } else {
      slot.innerHTML = `<span class="empty-slot-icon">${EMPTY_SLOT_SVG}</span>`;
    }
    enemyRow.appendChild(slot);
  }

  for(let i=0;i<LANES;i++){
    const slot = document.createElement('div');
    slot.className = 'slot';
    const card = state.playerBoard[i];
    if(card){
      const c = document.createElement('div');
      c.className = 'card';
      c.dataset.uid = card.uid;
      c.innerHTML = cardHTML(card);
      attachTilt(c);
      if(state.sacrificeMode){
        c.style.outline = '2px solid var(--blood-bright)';
        c.onclick = () => performSacrificePlay(i);
      }
      slot.appendChild(c);
    } else {
      slot.innerHTML = `<span class="empty-slot-icon">${EMPTY_SLOT_SVG}</span>`;
    }
    playerRow.appendChild(slot);
  }
}

function renderHand(){
  const hand = document.getElementById('hand');
  hand.innerHTML = '';
  const n = state.hand.length;
  const stepDeg = n > 1 ? Math.min(7, 34 / (n - 1)) : 0;
  state.hand.forEach((card, idx) => {
    const angle = (idx - (n - 1) / 2) * stepDeg;
    const slot = document.createElement('div');
    slot.className = 'hand-slot';
    slot.style.transform = `rotate(${angle}deg) scale(1.4)`;
    slot.style.zIndex = idx;

    const lift = document.createElement('div');
    lift.className = 'hand-lift';

    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = cardHTML(card);
    attachTilt(c);
    attachHandDrag(c, idx);

    lift.appendChild(c);
    slot.appendChild(lift);
    hand.appendChild(slot);
  });
  attachHandHover();
}

let handHoverAttached = false;
function attachHandHover(){
  const hand = document.getElementById('hand');
  if(handHoverAttached) return;
  handHoverAttached = true;
  hand.addEventListener('mousemove', e => {
    const hit = document.elementFromPoint(e.clientX, e.clientY);
    const slot = hit && hit.closest('.hand-slot');
    hand.querySelectorAll('.hand-slot.raised').forEach(s => { if(s !== slot) s.classList.remove('raised'); });
    if(slot) slot.classList.add('raised');
  });
  hand.addEventListener('mouseleave', () => {
    hand.querySelectorAll('.hand-slot.raised').forEach(s => s.classList.remove('raised'));
  });
}

/* ---------- Drag and drop (pick up a card, drop it on a lane) ---------- */
let dragIdx = null, dragOriginEl = null, dragGhost = null;

function attachHandDrag(el, idx){
  el.addEventListener('pointerdown', e => {
    if(state.turn !== 'player' || state.over) return;
    const startX = e.clientX, startY = e.clientY;
    let moved = false;

    const onMove = ev => {
      if(!moved && Math.hypot(ev.clientX - startX, ev.clientY - startY) > 6){
        moved = true;
        startDrag(idx, el, ev);
      }
      if(moved) updateDrag(ev);
    };
    const onUp = ev => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      if(moved) endDrag(ev);
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });
}

function startDrag(idx, originEl, ev){
  dragIdx = idx;
  dragOriginEl = originEl;
  originEl.style.opacity = '0.15';

  dragGhost = originEl.cloneNode(true);
  dragGhost.id = 'drag-ghost';
  dragGhost.style.left = ev.clientX + 'px';
  dragGhost.style.top = ev.clientY + 'px';
  document.body.appendChild(dragGhost);

  const card = state.hand[idx];
  const aliveCount = state.playerBoard.filter(Boolean).length;
  document.querySelectorAll('#player-row .slot').forEach((slot, i) => {
    if(!state.playerBoard[i] && (card.cost === 0 || aliveCount >= card.cost)){
      slot.classList.add('targetable');
    }
  });
}

function updateDrag(ev){
  if(!dragGhost) return;
  dragGhost.style.left = ev.clientX + 'px';
  dragGhost.style.top = ev.clientY + 'px';
  const hovered = document.elementFromPoint(ev.clientX, ev.clientY);
  const slot = hovered && hovered.closest('.slot.targetable');
  document.querySelectorAll('#player-row .slot.drag-hover').forEach(s => s.classList.remove('drag-hover'));
  if(slot) slot.classList.add('drag-hover');
}

function endDrag(ev){
  const hovered = document.elementFromPoint(ev.clientX, ev.clientY);
  const slot = hovered && hovered.closest('.slot.targetable');
  document.querySelectorAll('#player-row .slot').forEach(s => { s.classList.remove('targetable'); s.classList.remove('drag-hover'); });
  if(dragGhost){ dragGhost.remove(); dragGhost = null; }
  if(dragOriginEl){ dragOriginEl.style.opacity = ''; dragOriginEl = null; }

  if(slot){
    const laneIdx = Array.from(slot.parentElement.children).indexOf(slot);
    state.selectedHandIdx = dragIdx;
    dragIdx = null;
    tryPlayCard(laneIdx);
  } else {
    dragIdx = null;
  }
}

document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && state.sacrificeMode){
    state.sacrificeMode = false;
    state.selectedHandIdx = null;
    state.sacrificeStarted = false;
    log('You reconsider.');
    render();
  }
});

/* ---------- Player actions ---------- */
function tryPlayCard(laneIdx){
  if(state.turn !== 'player' || state.over) return;
  const idx = state.selectedHandIdx;
  if(idx === null) return;
  const card = state.hand[idx];
  if(state.playerBoard[laneIdx]) return;

  const aliveCount = state.playerBoard.filter(Boolean).length;
  if(card.cost > 0){
    if(aliveCount < card.cost){
      log(`Not enough creatures on the board to sacrifice for ${card.name} (needs ${card.cost}).`);
      return;
    }
    state.sacrificeMode = true;
    state.pendingLane = laneIdx;
    render();
    return;
  }

  state.playerBoard[laneIdx] = card;
  state.hand.splice(idx,1);
  state.selectedHandIdx = null;
  log(`You play ${card.name}.`);
  drawHand(1);
  render();
}

let sacrificesNeeded = 0;
let sacrificesDone = [];
function performSacrificePlay(laneClickedIdx){
  const idx = state.selectedHandIdx;
  const card = state.hand[idx];
  if(!state.sacrificeStarted){
    state.sacrificeStarted = true;
    sacrificesNeeded = card.cost;
    sacrificesDone = [];
  }
  const sacCard = state.playerBoard[laneClickedIdx];
  if(!sacCard) return;
  state.playerBoard[laneClickedIdx] = null;
  sacrificesDone.push(sacCard.name);
  state.playerBones += 1;

  if(sacrificesDone.length >= sacrificesNeeded){
    const lane = state.pendingLane;
    state.playerBoard[lane] = card;
    state.hand.splice(idx,1);
    log(`You sacrifice ${sacrificesDone.join(', ')} to summon ${card.name}.`);
    state.selectedHandIdx = null;
    state.sacrificeMode = false;
    state.sacrificeStarted = false;
    drawHand(1);
  }
  render();
}

/* ---------- Combat ---------- */
function endTurn(){
  if(state.turn !== 'player' || state.over) return;
  state.selectedHandIdx = null;
  state.sacrificeMode = false;
  state.turn = 'enemy';
  render();
  setTimeout(playerAttackPhase, 300);
}

async function playerAttackPhase(){
  for(let i=0;i<LANES;i++){
    if(state.over) return;
    const attacker = state.playerBoard[i];
    if(!attacker) continue;
    await doAttack(attacker, i, state.playerBoard, state.enemyBoard, 'enemy');
    await sleep(250);
  }
  if(state.over) return;
  setTimeout(enemyTurn, 400);
}

async function enemyTurn(){
  // simple AI: play cards into empty lanes if it can afford sacrifice; else play free cards
  enemyPlayCards();
  state.enemyTelegraph = [];
  render();
  await sleep(500);
  for(let i=0;i<LANES;i++){
    if(state.over) return;
    const attacker = state.enemyBoard[i];
    if(!attacker) continue;
    await doAttack(attacker, i, state.enemyBoard, state.playerBoard, 'player');
    await sleep(250);
  }
  if(state.over) return;
  state.turn = 'player';
  planEnemyTelegraph();
  render();
}

function planEnemyTelegraph(){
  const emptyLanes = [];
  for(let i=0;i<LANES;i++) if(!state.enemyBoard[i]) emptyLanes.push(i);
  for(let i=emptyLanes.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [emptyLanes[i], emptyLanes[j]] = [emptyLanes[j], emptyLanes[i]];
  }
  state.enemyTelegraph = emptyLanes.slice(0, 2);
}

function enemyPlayCards(){
  const emptyLanes = (state.enemyTelegraph && state.enemyTelegraph.length)
    ? state.enemyTelegraph.filter(i => !state.enemyBoard[i])
    : [];
  for(let i=0;i<LANES;i++) if(!state.enemyBoard[i] && !emptyLanes.includes(i)) emptyLanes.push(i);
  if(emptyLanes.length === 0) return;

  let aliveCount = state.enemyBoard.filter(Boolean).length;
  // try to fill up to 2 lanes a turn
  let plays = 0;
  while(emptyLanes.length > 0 && plays < 2){
    const lane = emptyLanes.shift();
    const card = drawEnemyCard();
    if(card.cost > 0){
      if(aliveCount < card.cost) continue;
      // sacrifice weakest creatures
      const sacIdx = [];
      const boardCopy = state.enemyBoard.map((c,i)=>({c,i})).filter(x=>x.c);
      boardCopy.sort((a,b)=>a.c.atk - b.c.atk);
      for(let k=0;k<card.cost && k<boardCopy.length;k++) sacIdx.push(boardCopy[k].i);
      if(sacIdx.length < card.cost) continue;
      sacIdx.forEach(si => { log(`Enemy sacrifices ${state.enemyBoard[si].name}.`); state.enemyBoard[si] = null; });
      aliveCount -= sacIdx.length;
    }
    state.enemyBoard[lane] = card;
    aliveCount += 1;
    log(`Enemy plays ${card.name}.`);
    plays++;
  }
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

async function doAttack(attacker, laneIdx, ownBoard, enemyBoard, targetSide){
  const cardEl = document.querySelector(`.card[data-uid="${attacker.uid}"]`);
  if(cardEl) cardEl.classList.add('attacking');
  await sleep(280);

  const defender = enemyBoard[laneIdx];
  if(defender){
    defender.curHp -= attacker.atk;
    attacker.curHp -= defender.atk;
    log(`${attacker.name} (${attacker.atk}) clashes with ${defender.name} (${defender.atk}).`);
    render();
    const defEl = document.querySelector(`.card[data-uid="${defender.uid}"]`);
    if(defEl) defEl.classList.add('hit');
    const atkEl = document.querySelector(`.card[data-uid="${attacker.uid}"]`);
    if(atkEl) atkEl.classList.add('hit');
    await sleep(350);

    if(defender.curHp <= 0){
      log(`${defender.name} dies.`);
      enemyBoard[laneIdx] = null;
    }
    if(attacker.curHp <= 0){
      log(`${attacker.name} dies.`);
      ownBoard[laneIdx] = null;
    }
  } else {
    if(targetSide === 'enemy'){
      state.enemyHP -= attacker.atk;
      log(`${attacker.name} strikes the enemy directly for ${attacker.atk}.`);
    } else {
      state.playerHP -= attacker.atk;
      log(`${attacker.name} strikes you directly for ${attacker.atk}.`);
    }
  }
  render();
  checkGameOver();
}

function checkGameOver(){
  if(state.over) return;
  if(state.playerHP <= 0){
    state.over = true;
    showOverlay('YOU DIED', 'The forest claims another fool. Your bones join the pile.');
  } else if(state.enemyHP <= 0){
    state.over = true;
    showOverlay('VICTORY', 'The opponent falls silent. You may leave this table... for now.');
  }
}

function showOverlay(title, text){
  document.getElementById('overlay-title').textContent = title;
  document.getElementById('overlay-text').textContent = text;
  document.getElementById('overlay').classList.remove('hidden');
}

/* ---------- Init ---------- */
document.getElementById('end-turn-btn').onclick = endTurn;
document.getElementById('restart-btn').onclick = () => { newGame(); };
document.getElementById('overlay-restart').onclick = () => {
  document.getElementById('overlay').classList.add('hidden');
  newGame();
};

// ambient candle flicker loop
setInterval(() => {
  const f = document.getElementById('flicker');
  f.style.transition = 'opacity .6s ease';
  f.style.opacity = (Math.random()*0.04).toString();
}, 2200);

// drifting embers
const emberContainer = document.getElementById('embers');
for(let i=0;i<22;i++){
  const e = document.createElement('div');
  e.className = 'ember';
  e.style.left = (Math.random()*100) + '%';
  e.style.animationDuration = (10 + Math.random()*10) + 's';
  e.style.animationDelay = (Math.random()*14) + 's';
  emberContainer.appendChild(e);
}

newGame();
</script>
